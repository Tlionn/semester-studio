services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: semester-studio:local
    ports:
      - target: 8080
        published: "${HOST_PORT:-8080}"
        host_ip: "${HOST_BIND:-127.0.0.1}"
        protocol: tcp
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
